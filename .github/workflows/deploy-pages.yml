name: Deploy to GitHub Pages

# GitHub Pages only serves static files, so the Python backend cannot run there.
# Instead, this workflow runs the backend's tennis exporter and publishes its
# output (data/tennis.json and data/history/*.json) next to the frontend.
# The schedule keeps it fresh.
on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install backend
        working-directory: backend
        run: uv sync --locked
      - name: Test backend
        if: github.event_name != 'schedule'
        working-directory: backend
        run: uv run ruff check . && uv run pytest -q
      - name: Export tennis data (live snapshot and recent seasons)
        working-directory: backend
        # On a push, an ESPN outage should not block shipping the guide; the page
        # then says the data is unavailable. On the schedule, fail and keep the
        # previous deploy (and its data) live instead.
        continue-on-error: ${{ github.event_name != 'schedule' }}
        run: uv run python -m app.export_tennis ../frontend/public/data

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
